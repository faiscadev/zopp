[package]
name = "zopp-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Sync framework for zopp — SyncTarget trait, DiffEngine, and shared types"

[features]
default = []
aws = ["dep:aws-sdk-secretsmanager", "dep:aws-config", "dep:tokio"]
gcp = []
fly = ["dep:reqwest", "dep:zeroize", "dep:tokio"]
vercel = []
render = []
railway = []

[dependencies]
async-trait.workspace = true
aws-config = { workspace = true, optional = true }
aws-sdk-secretsmanager = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json"], optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
